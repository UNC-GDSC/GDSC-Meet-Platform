name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-server:
    name: Test Server
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install dependencies
      working-directory: ./server
      run: npm ci

    - name: Run linter
      working-directory: ./server
      run: npm run lint --if-present

    - name: Run tests
      working-directory: ./server
      run: npm test --if-present

    - name: Build
      working-directory: ./server
      run: npm run build

  test-client:
    name: Test Client
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      working-directory: ./client
      run: npm ci

    - name: Run linter
      working-directory: ./client
      run: npm run lint --if-present

    - name: Run tests
      working-directory: ./client
      run: npm test --if-present

    - name: Build
      working-directory: ./client
      run: npm run build

  build-and-push:
    name: Build and Push Docker Images
    needs: [test-server, test-client]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push server image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.server
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/gdsc-meet-server:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/gdsc-meet-server:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/gdsc-meet-server:latest
        cache-to: type=inline

    - name: Build and push client image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.client
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/gdsc-meet-client:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/gdsc-meet-client:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/gdsc-meet-client:latest
        cache-to: type=inline

  deploy:
    name: Deploy to Kubernetes
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/
        kubectl rollout status deployment/gdsc-meet-server
        kubectl rollout status deployment/gdsc-meet-client
